# Adobe App Builder app: Territory FFCPE custom nodes.
#
# Each custom node is a web + worker action pair (Adobe FFCPE Custom Node SDK):
#   <node>-web     web: "raw", require-adobe-auth: false — POST /submit, GET /status
#                  (IMS inbound auth is done by mountFfcpeNodeRoutes itself)
#   <node>-worker  runs the node handler asynchronously
# STAGE DEPLOY BRANCH stage/color-detection: Color Detection ONLY.
# Image Extension is intentionally not in this manifest, so it cannot be deployed from here.
#
# Not wired to an Adobe Developer Console workspace yet — nothing is deployed.
application:
  actions: actions
  runtimeManifest:
    packages:
      territory-ffcpe-nodes:
        license: UNLICENSED
        actions:
          # --- Color Detection (no Adobe API call) ---
          color-detection-web:
            function: actions/color-detection/color-detection.web.ts
            web: "raw"
            runtime: nodejs:22
            annotations:
              require-adobe-auth: false
            inputs:
              # comma-separated caller client ids; empty = run-workflow-service only
              ALLOWED_CALLER_CLIENT_IDS: $ALLOWED_CALLER_CLIENT_IDS
          color-detection-worker:
            function: actions/color-detection/color-detection.worker.ts
            runtime: nodejs:22
            limits:
              memorySize: 1024
              timeout: 120000
            inputs:
              LOG_LEVEL: info
