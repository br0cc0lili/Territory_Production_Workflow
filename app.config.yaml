# Adobe App Builder app: Territory FFCPE custom nodes.
#
# Each custom node is a web + worker action pair (Adobe FFCPE Custom Node SDK):
#   <node>-web     web: "raw", require-adobe-auth: false — POST /submit, GET /status
#                  (IMS inbound auth is done by mountFfcpeNodeRoutes itself)
#   <node>-worker  runs the node handler asynchronously
# Node pairs are added on their feature branches (feature/color-detection,
# feature/image-extension).
#
# Not wired to an Adobe Developer Console workspace yet — nothing is deployed.
application:
  actions: actions
  runtimeManifest:
    packages:
      territory-ffcpe-nodes:
        license: UNLICENSED
        actions:
          # --- Color Detection (no Adobe API call) ---
          color-detection-web:
            function: actions/color-detection/color-detection.web.ts
            web: "raw"
            runtime: nodejs:22
            annotations:
              require-adobe-auth: false
            inputs:
              # comma-separated caller client ids; empty = run-workflow-service only
              ALLOWED_CALLER_CLIENT_IDS: $ALLOWED_CALLER_CLIENT_IDS
          color-detection-worker:
            function: actions/color-detection/color-detection.worker.ts
            runtime: nodejs:22
            limits:
              memorySize: 1024
              timeout: 120000
            inputs:
              LOG_LEVEL: info
          # --- Image Extension (Firefly Services) ---
          image-extension-web:
            function: actions/image-extension/image-extension.web.ts
            web: "raw"
            runtime: nodejs:22
            annotations:
              require-adobe-auth: false
            inputs:
              # comma-separated caller client ids; empty = run-workflow-service only
              ALLOWED_CALLER_CLIENT_IDS: $ALLOWED_CALLER_CLIENT_IDS
          image-extension-worker:
            function: actions/image-extension/image-extension.worker.ts
            runtime: nodejs:22
            limits:
              memorySize: 2048
              timeout: 600000
            annotations:
              # injects the workspace OAuth Server-to-Server credential (Firefly Services)
              # as __ims_oauth_s2s — read only by src/core/firefly-auth.js
              include-ims-credentials: true
            inputs:
              LOG_LEVEL: info
